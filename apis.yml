aid: griffin
name: Griffin
description: >-
  Griffin is a UK-regulated bank (Financial Conduct Authority authorised,
  Prudential Regulation Authority regulated) offering Banking-as-a-Service via a
  REST API. Fintechs and businesses embed FSCS-eligible bank accounts, payments
  (Faster Payments, BACS, CHAPS, book transfers, Confirmation of Payee),
  automated KYC/KYB onboarding (Verify), client-money and safeguarding accounts,
  savings accounts, and open banking directly into their own products. The v0
  API uses API-key authentication with mandatory HTTP message signatures in live,
  documented webhooks, a full sandbox, and a first-party MCP server.
