- aid: griffin:griffin-bank-account-restrictions-api
  name: Griffin Bank account restrictions API
  description: "Restrictions prevent payments on a bank account. A `freeze` blocks outbound payments while\
    \ still allowing inbound payments. A `block` prevents both inbound and outbound payments. \n\n Restrictions\
    \ can be applied at any point in the account lifecycle (`opening`, `open`, `closing`, or `closed`),\
    \ and multiple restrictions can be active on the same account simultaneously. Each restriction is\
    \ independent — lifting one does not affect others. \n\n Restrictions can only be updated or lifted\
    \ if `active`. \n\n For more information, see our guide on [managing restrictions](/docs/guides/managing-restrictions)."
  humanURL: https://docs.griffin.com/
  baseURL: https://api.griffin.com/v0
