- aid: griffin:griffin-open-banking-api
  name: Griffin Open banking API
  description: >-
    Open banking allows regulated third-party providers (TPPs) to access your customers' account data
    or initiate payments on their behalf.

    Griffin partners with [tell.money](https://tell.money/) to provide the TPP-facing open banking APIs.

    You handle the consent flow — authenticating your customer and registering the consent with Griffin
    — and Griffin handles the resource requests from TPPs.


    For a full walkthrough, see our [open banking integration guide](/docs/guides/open-banking-customer-accounts).
