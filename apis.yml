- aid: griffin:griffin-invitations-api
  name: Griffin Invitations API
  description: >-
    Invitations enable [users](#tag/Users) to create new [memberships](#tag/Memberships) for their [organization](#tag/Organizations).

    The new membership is only created once when the invitation is accepted.


    If the `email-address` provided is linked to an existing user, the invitation will create a membership
    for that user.

    This does not affect any other memberships the user may have.


    If the `email-address` is not linked to an existing user, the invitee will be prompted to set up a
    Griffin account when they accept the invitation.


    When a new membership is created, the invited user is assigned the [role](#tag/Roles) with the most
    limited set of capabilities by default.
  humanURL: https://docs.griffin.com/
  baseURL: https://api.griffin.com/v0
