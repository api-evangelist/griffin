                  x-allOf:
                  - type: string
                  - {}
                  - type: object
                    properties:
                      bank-account-id:
                        type: string
                        format: ''
                        title: bank-account-id
                        required: true
                        name: bank-account-id
                    required:
                    - bank-account-id
                - type: string
                  x-allOf:
                  - type: string
                  - {}
                  - type: object
                    properties:
                      bank-account-id:
                        type: string
                        format: ''
                        title: bank-account-id
                        required: true
                        name: bank-account-id
                    required:
                    - bank-account-id
                title: account-url
                example: /v0/bank/accounts/ba.IGJhbmstYWNjb3VudC1pZA
                description: Link to the bank account resource.
            tell-consent-expiry:
              title: inst
              format: date-time
              type: string
              description: ISO 8601 formatted date-time.
          required:
          - tell-consent-id
          - tell-gateway-id
          - tell-consent-scope
          - tell-consent-permissions
          - bank-account-urls
          x-allOf:
          - type: object
            properties: {}
            required: []
          - {}
          title: request-register-tell-consent
      - type: string
        required: true
        name: organization-id
        in: path
      responses:
        '201':
          schema:
            type: object
            properties:
