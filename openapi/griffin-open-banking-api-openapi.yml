  /v0/organizations/{organization-id}/open-banking/tell-consents:
    post:
      tags:
      - Open banking
      description: "Register a Tell consent for open banking on your customers' accounts.\n\nAfter granting a consent with Tell Money, register it with Griffin so\nthat Griffin can validate Tell's subsequent resource requests.\n\n`tell-consent-permissions` behaviour depends on `tell-consent-scope`:\n  - `accounts` scope requires at least one permission; this controls which\n    AISP operations the TPP can perform (e.g. reading balances or\n    transactions).\n  - `payments` scope does not use permissions — Tell Money returns them\n    empty and Griffin authorises payment operations from the scope alone.\n    Pass `[]` (matching Tell's response) or any value; the field is still\n    required in the request."
      parameters:
      - in: body
        name: request-register-tell-consent
        description: ''
        required: true
        schema:
          type: object
          properties:
            tell-consent-id:
              type: string
              format: uuid
            tell-gateway-id:
              type: string
              format: uuid
            tell-consent-scope:
              type: string
              enum:
              - payments
              - accounts
            tell-consent-permissions:
              type: array
              items:
                type: string
                enum:
                - ReadPartyPSU
                - ReadTransactionsDetail
                - ReadProducts
                - ReadStatementsDetail
                - ReadDirectDebits
                - ReadTransactionsDebits
                - ReadTransactionsCredits
                - ReadBeneficiariesDetail
                - ReadBalances
                - ReadPAN
                - ReadScheduledPaymentsDetail
                - ReadAccountsDetail
                - ReadAccountsBasic
                - ReadOffers
                - ReadBeneficiariesBasic
                - ReadStandingOrdersBasic
                - ReadStandingOrdersDetail
                - ReadTransactionsBasic
                - ReadParty
                - ReadStatementsBasic
                - ReadScheduledPaymentsBasic
              uniqueItems: true
              description: Permissions granted by the consent. For `accounts` scope, must list at least one permission. For `payments` scope, pass `[]` — Tell Money returns no permissions and Griffin authorises payments from the scope alone.
            bank-account-urls:
              type: array
              items:
                type: string
                x-allOf:
                - type: string
                - {}
                - type: object
                  properties:
                    bank-account-id:
