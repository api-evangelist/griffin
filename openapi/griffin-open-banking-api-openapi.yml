                  - {}
                  - type: object
                    properties:
                      bank-account-id:
                        type: string
                        format: ''
                        title: bank-account-id
                        required: true
                        name: bank-account-id
                    required:
                    - bank-account-id
                  x-anyOf:
                  - type: string
                    x-allOf:
                    - type: string
                    - {}
