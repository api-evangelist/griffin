                          x-anyOf:
                          - type: string
                            x-allOf:
                            - type: string
                            - {}
                            - type: object
                              properties:
                                role-id:
                                  type: string
                                  format: ''
                                  title: role-id
                                  required: true
                                  name: role-id
                              required:
                              - role-id
                          - type: string
                            x-allOf:
                            - type: string
                            - {}
                            - type: object
                              properties:
                                role-id:
                                  type: string
                                  format: ''
                                  title: role-id
                                  required: true
                                  name: role-id
                              required:
                              - role-id
                          title: role-url
                          example: /v0/roles/re.ICAgICAgICAgcm9sZS1pZA
                          description: Link to the [role](#tag/Roles).
                        role-category:
                          type: string
                      required:
                      - display-name
                      - description
                      - role-url
                      title: role
                    title: roles
                    description: Shows a collection of [roles](#tag/Roles).
                required:
                - roles
                title: roles-response
      summary: List roles
      operationId: getV0Roles
      x-operation-id-source: derived
  /v0/roles/{role-id}:
    get:
      tags:
      - Roles
      description: Yields the Role resource.
      security: []
      parameters:
      - required: true
        name: role-id
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  display-name:
                    type: string
                    minLength: 1
                    title: display-name
                    description: A human readable label for an entity
                  description:
                    type: string
                    title: description
                  role-url:
                    type: string
                    x-allOf:
                    - type: string
                    - {}
                    - type: object
                      properties:
                        role-id:
                          type: string
                          format: ''
                          title: role-id
                          required: true
                          name: role-id
                      required:
                      - role-id
                    x-anyOf:
                    - type: string
                      x-allOf:
                      - type: string
                      - {}
                      - type: object
                        properties:
                          role-id:
                            type: string
                            format: ''
                            title: role-id
                            required: true
