                - role-url
                title: role
        '400':
          description: ''
        '404':
          description: ''
      summary: Get role
      operationId: getV0RolesByRoleId
      x-operation-id-source: derived
components:
  securitySchemes:
    api-key-auth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API token authentication.

        It should follow the format: `GriffinAPIKey g-test-MyKey-XXXXXXX`'
