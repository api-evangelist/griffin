                                description: Link to the bank account resource.
                              creditor-type:
                                enum:
                                - griffin-bank-account
                                type: string
                            required:
                            - account-url
                            - creditor-type
                            title: griffin-bank-account
                          - type: object
                            properties:
                              iban:
                                title: iban
                                pattern: ^[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}$
                                type: string
                                description: An International Bank Account Number.
                                maxLength: 34
                                example: GB42GFNB12345612345678
                                minLength: 5
                              uk-domestic-sort-code:
                                title: uk-domestic-sort-code
                                pattern: ^[0-9]{6}$
                                type: string
                                description: A UK sort code.
                                maxLength: 6
                                example: '123456'
                                minLength: 6
                              bic:
                                title: bic
                                pattern: '[A-Z]{6,6}[A-Z2-9][A-NP-Z0-9]([A-Z0-9]{3,3}){0,1}'
                                type: string
                                description: A BIC.
                                maxLength: 11
                                example: GFNBGB22
                                minLength: 8
                              account-number:
