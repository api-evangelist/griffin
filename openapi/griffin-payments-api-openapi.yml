                            title: book-transfer
                          - type: object
                            properties:
                              payment-scheme:
                                enum:
                                - chaps
                                type: string
                            title: chaps
                            required:
                            - payment-scheme
                          - type: object
                            properties:
                              payment-scheme:
                                enum:
                                - bacs
                                type: string
                            title: bacs
                            required:
                            - payment-scheme
                        payment-url:
                          type: string
                          title: payment-url
