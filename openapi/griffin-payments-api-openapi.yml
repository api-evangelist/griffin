  /v0/bank/accounts/{bank-account-id}/payments:
    get:
      tags:
      - Payments
      description: Lists payments made from a bank account.
      parameters:
      - in: query
        name: sort
        description: ''
        type: string
        required: false
        enum:
        - -created-at
        - created-at
      - x-allOf:
        - type: integer
          format: int64
        - minimum: 1
          maximum: 201
        maximum: 200
        minimum: 1
        name: page[size]
        required: false
        type: integer
        description: ''
        format: int64
        in: query
      - in: query
        name: page[before]
        description: A base64 encoded opaque string returned in paginated responses.
        type: string
        required: false
        format: byte
      - in: query
        name: page[after]
        description: A base64 encoded opaque string returned in paginated responses.
        type: string
        required: false
        format: byte
      - in: query
        name: include
        description: For each payment returned, include its bank account, latest submission (if one exists), rejecting user (if one exists), and/or creating user (if one exists) in the response under the `included` attribute.
        type: array
        required: false
        x-allOf:
        - {}
        - {}
        items:
          enum:
          - bank-account
          - rejected-by
          - latest-submission.created-by
          - created-by
          - latest-submission
          type: string
      - in: query
        name: filter[rejected][eq]
        description: Specifies whether the payment has been [rejected](/docs/guides/payment-approvals).
        type: boolean
        required: false
      - in: query
        name: filter[payment-direction][eq]
        description: Whether the payment is moving money into or out of the account.
        type: string
        required: false
        enum:
        - inbound-payment
        - outbound-payment
      - in: query
        name: filter[latest-submission-status][in][]
        description: ''
        type: array
        required: false
        x-allOf:
        - {}
        - {}
        items:
          enum:
          - scheduled
          - failed
          - processing
          - returned
          - delivered
          type: string
          x-anyOf:
          - title: submission-status
            enum:
            - scheduled
            - failed
            - processing
            - returned
            - delivered
            type: string
            description: Specifies the progress of the outbound payment.
          - enum:
            - 'null'
            type: string
            title: no-latest-submission-status
            description: No latest submission status
      - in: query
        name: filter[created-at][lte]
        description: Return only resources with a created-at less than or equal to the given timestamp.
        type: string
        required: false
        format: date-time
      - in: query
        name: filter[created-at][lt]
        description: Return only resources with a created-at less than the given timestamp.
        type: string
        required: false
        format: date-time
      - in: query
        name: filter[created-at][gte]
        description: Return only resources with a created-at greater than or equal to the given timestamp.
        type: string
        required: false
        format: date-time
      - in: query
        name: filter[created-at][gt]
        description: Return only resources with a created-at greater than the given timestamp.
        type: string
        required: false
        format: date-time
      - type: string
        required: true
        name: bank-account-id
        in: path
      responses:
        '200':
          schema:
            type: object
            properties:
              payments:
                type: array
                items:
                  type: object
                  properties:
                    creditor:
                      type: object
                      properties: {}
                      required:
                      - creditor-type
                      title: creditor
                      x-anyOf:
                      - type: object
                        properties:
                          account-url:
                            type: string
                            x-allOf:
                            - type: string
                            - {}
                            - type: object
                              properties:
                                bank-account-id:
                                  type: string
                                  format: ''
                                  title: bank-account-id
                                  required: true
                                  name: bank-account-id
                              required:
                              - bank-account-id
                            x-anyOf:
                            - type: string
                              x-allOf:
                              - type: string
                              - {}
                              - type: object
                                properties:
                                  bank-account-id:
                                    type: string
                                    format: ''
                                    title: bank-account-id
                                    required: true
                                    name: bank-account-id
                                required:
                                - bank-account-id
                            - type: string
                              x-allOf:
                              - type: string
                              - {}
                              - type: object
                                properties:
                                  bank-account-id:
                                    type: string
                                    format: ''
                                    title: bank-account-id
                                    required: true
                                    name: bank-account-id
                                required:
                                - bank-account-id
                            title: account-url
                            example: /v0/bank/accounts/ba.IGJhbmstYWNjb3VudC1pZA
                            description: Link to the bank account resource.
