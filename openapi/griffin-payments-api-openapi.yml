                                - gbdsc
                                deprecated: true
                              bank-id:
                                title: bank-id
                                pattern: ^[0-9]{6}$
                                type: string
                                description: A UK sort code.
                                maxLength: 6
                                example: '123456'
                                minLength: 6
                                deprecated: true
                              creditor-type:
                                enum:
                                - uk-domestic
                                type: string
                              bban:
                                title: bban
                                pattern: ^[a-zA-Z0-9]{1,30}$
                                type: string
                                description: A country-specific Basic Bank Account Number.
                                maxLength: 30
                                example: GFNB12345612345678
                                minLength: 1
                              account-url:
                                type: string
                                x-allOf:
                                - type: string
                                - {}
                                - type: object
                                  properties:
                                    bank-account-id:
                                      type: string
                                      format: ''
                                      title: bank-account-id
                                      required: true
                                      name: bank-account-id
                                  required:
                                  - bank-account-id
                                x-anyOf:
                                - type: string
                                  x-allOf:
                                  - type: string
                                  - {}
                                  - type: object
                                    properties:
                                      bank-account-id:
                                        type: string
                                        format: ''
                                        title: bank-account-id
                                        required: true
                                        name: bank-account-id
                                    required:
                                    - bank-account-id
                                - type: string
                                  x-allOf:
                                  - type: string
                                  - {}
                                  - type: object
                                    properties:
                                      bank-account-id:
                                        type: string
                                        format: ''
                                        title: bank-account-id
                                        required: true
                                        name: bank-account-id
                                    required:
                                    - bank-account-id
                                title: account-url
                                example: /v0/bank/accounts/ba.IGJhbmstYWNjb3VudC1pZA
                                description: Link to the bank account resource.
                              uk-domestic-account-number:
                                type: string
                                x-allOf:
                                - type: string
                                - {}
                                title: uk-domestic-account-number
                                pattern: ^[0-9]{8}$
                                description: A UK account number.
                                maxLength: 8
                                example: '12345678'
                                minLength: 8
                              other-account-identification:
                                title: other-account-identification
                                type: string
                                description: Uncategorised account identification
                                maxLength: 64
                                example: ABC123
                                minLength: 1
