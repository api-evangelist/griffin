  /v0/bank/accounts/{bank-account-id}/payments:
    get:
      tags:
      - Payments
      description: Lists payments made from a bank account.
      parameters:
      - in: query
        name: sort
        description: ''
        required: false
        schema:
          type: string
          enum:
          - -created-at
          - created-at
      - x-allOf:
        - type: integer
          format: int64
        - minimum: 1
          maximum: 201
        name: page[size]
        required: false
        description: ''
        in: query
        schema:
          type: integer
          format: int64
          maximum: 200
          minimum: 1
      - in: query
        name: page[before]
        description: A base64 encoded opaque string returned in paginated responses.
        required: false
        schema:
          type: string
          format: byte
      - in: query
        name: page[after]
        description: A base64 encoded opaque string returned in paginated responses.
        required: false
        schema:
          type: string
          format: byte
      - in: query
        name: include
        description: For each payment returned, include its bank account, latest submission (if one exists), rejecting user (if one exists), and/or creating user (if one exists) in the response under the `included` attribute.
        required: false
        x-allOf:
        - {}
        - {}
        schema:
          type: array
          items:
            enum:
            - bank-account
            - rejected-by
            - latest-submission.created-by
            - created-by
            - latest-submission
            type: string
      - in: query
        name: filter[rejected][eq]
        description: Specifies whether the payment has been [rejected](/docs/guides/payment-approvals).
        required: false
        schema:
          type: boolean
      - in: query
        name: filter[payment-direction][eq]
        description: Whether the payment is moving money into or out of the account.
        required: false
        schema:
          type: string
          enum:
          - inbound-payment
          - outbound-payment
      - in: query
        name: filter[latest-submission-status][in][]
        description: ''
        required: false
        x-allOf:
        - {}
        - {}
        schema:
          type: array
          items:
            enum:
            - scheduled
            - failed
            - processing
            - returned
            - delivered
            type: string
            x-anyOf:
            - title: submission-status
              enum:
              - scheduled
              - failed
              - processing
              - returned
              - delivered
              type: string
              description: Specifies the progress of the outbound payment.
            - enum:
              - 'null'
              type: string
              title: no-latest-submission-status
              description: No latest submission status
      - in: query
        name: filter[created-at][lte]
        description: Return only resources with a created-at less than or equal to the given timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[created-at][lt]
        description: Return only resources with a created-at less than the given timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[created-at][gte]
        description: Return only resources with a created-at greater than or equal to the given timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[created-at][gt]
        description: Return only resources with a created-at greater than the given timestamp.
        required: false
        schema:
          type: string
          format: date-time
      - required: true
        name: bank-account-id
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      type: object
                      properties:
                        creditor:
                          type: object
                          properties: {}
                          required:
                          - creditor-type
                          title: creditor
                          x-anyOf:
                          - type: object
                            properties:
                              account-url:
                                type: string
                                x-allOf:
                                - type: string
                                - {}
                                - type: object
                                  properties:
                                    bank-account-id:
                                      type: string
                                      format: ''
                                      title: bank-account-id
                                      required: true
                                      name: bank-account-id
                                  required:
                                  - bank-account-id
                                x-anyOf:
                                - type: string
                                  x-allOf:
                                  - type: string
                                  - {}
                                  - type: object
                                    properties:
                                      bank-account-id:
                                        type: string
                                        format: ''
                                        title: bank-account-id
                                        required: true
                                        name: bank-account-id
                                    required:
