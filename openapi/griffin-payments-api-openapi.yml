openapi: 3.2.0
info:
  title: Griffin Payments API
  version: ''
  description: '## Introduction


    The Griffin API is based on REST.'
servers:
- url: https://api.griffin.com/
security:
- api-key-auth: []
tags:
- name: Payments
  description: 'A payment captures the intent to move funds from a bank account to another bank account. Outbound payments can be made from your bank account to a payee. Griffin accepts inbound payments to your bank accounts on your behalf.

    If it''s your first time using our payments API, check out our guide for sending payments'
paths:
  /v0/admissions/{admission-id}:
    get:
      tags:
      - Payments
      description: Yields an admission.
      parameters:
      - required: true
        name: admission-id
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  admission-status:
                    title: admission-status
                    enum:
                    - cancelled
                    - processing
                    - returned
                    - delivered
                    type: string
                    description: Specifies the progress of the inbound payment.
                  admission-scheme-information:
                    type: object
                    properties: {}
                    required:
                    - payment-scheme
                    title: admission-scheme-information
                    x-anyOf:
                    - type: object
                      properties:
                        end-to-end-identification:
                          title: end-to-end-identification
                          type: string
                          minLength: 1
                          x-allOf:
                          - title: non-empty-string
                            type: string
                            minLength: 1
                          - {}
                          description: An identifier for a payment, assigned by the originator, passed along unchanged throughout the entire end-to-end chain. Not necessarily unique.
                        payment-scheme:
                          enum:
                          - fps
                          type: string
                      required:
                      - end-to-end-identification
                      - payment-scheme
                      title: fps
                    - type: object
                      properties:
                        end-to-end-identification:
                          title: end-to-end-identification
                          type: string
                          minLength: 1
                          x-allOf:
                          - title: non-empty-string
                            type: string
                            minLength: 1
                          - {}
                          description: An identifier for a payment, assigned by the originator, passed along unchanged throughout the entire end-to-end chain. Not necessarily unique.
                        payment-scheme:
                          enum:
                          - book-transfer
                          type: string
                      required:
                      - end-to-end-identification
                      - payment-scheme
                      title: book-transfer
                    - type: object
                      properties:
                        payment-scheme:
                          enum:
                          - chaps
                          type: string
                      title: chaps
                      required:
                      - payment-scheme
                    - type: object
                      properties:
                        payment-scheme:
                          enum:
                          - bacs
                          type: string
                      title: bacs
                      required:
                      - payment-scheme
                  payment-url:
                    type: string
                    title: payment-url
                    example: /v0/payments/pm.ICAgICAgcGF5bWVudC1pZA
                    description: Link to the payment resource.
                  created-at:
                    title: created-at
                    format: date-time
                    type: string
                    description: ISO 8601 formatted date-time.
                  admission-url:
                    type: string
                    title: admission-url
                    example: /v0/admissions/pa.ICAgIGFkbWlzc2lvbi1pZA
                  unique-scheme-identifier:
                    type: string
                    title: unique-scheme-identifier
                    maxLength: 140
                    example: 'PGIT2IS7AJG77D2HK23020240212826NatWes     '
                    minLength: 1
                  account-url:
                    type: string
                    x-allOf:
                    - type: string
                    - {}
                    - type: object
                      properties:
                        bank-account-id:
                          type: string
                          format: ''
                          title: bank-account-id
                          required: true
                          name: bank-account-id
                      required:
                      - bank-account-id
                    x-anyOf:
                    - type: string
                      x-allOf:
                      - type: string
                      - {}
                      - type: object
                        properties:
                          bank-account-id:
                            type: string
                            format: ''
                            title: bank-account-id
                            required: true
                            name: bank-account-id
                        required:
                        - bank-account-id
                    - type: string
                      x-allOf:
                      - type: string
                      - {}
                      - type: object
                        properties:
                          bank-account-id:
                            type: string
                            format: ''
                            title: bank-account-id
                            required: true
                            name: bank-account-id
                        required:
                        - bank-account-id
                    title: account-url
                    example: /v0/bank/accounts/ba.IGJhbmstYWNjb3VudC1pZA
                    description: Link to the bank account resource.
                  original-unique-scheme-identifier:
                    type: string
                    title: original-unique-scheme-identifier
                    maxLength: 140
                    example: 'PGIT2IS7AJG77D2HK23020240212826NatWes     '
                    minLength: 1
                required:
                - admission-status
                - admission-scheme-information
                - payment-url
                - created-at
                - admission-url
                - unique-scheme-identifier
                - account-url
                title: admission
        '400':
          description: ''
        '401':
          description: Requires an API key to continue
          headers:
            www-authenticate:
              description: Returns `GriffinSession` if no valid authentication is found.
              schema:
                type: string
        '403':
          description: ''
        '404':
          description: ''
      summary: Get payment admission
      operationId: getV0AdmissionsByAdmissionId
      x-operation-id-source: derived
