tags:
- name: Bank Accounts
  description: 'Bank accounts are used for managing funds. Every bank account is opened against a bank product, which determines the account''s behaviour (type, pooled vs dedicated, interest, notice period, etc.). Some account types are for managing your own funds and some are for managing your customers'' funds. For information, check out our guides:

    - Opening a bank account.

    - Bank products.

    - Types of bank account.'
