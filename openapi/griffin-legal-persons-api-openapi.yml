    post:
      tags:
      - Legal persons
      description: Creates a new Legal Person. A collection of [Claims](#tag/Claims) may be provided.
      parameters:
      - in: body
        name: request-create-legal-person
        description: ''
        required: true
        schema:
          type: object
          properties:
            display-name:
              type: string
              minLength: 1
              title: display-name
              description: A human readable label for an entity
            legal-person-type:
              title: legal-person-type
              enum:
              - individual
              - corporation
              type: string
              description: Specifies if the legal person is an `individual` or a `corporation`.
            claims:
              type: array
              items:
                type: object
                properties: {}
                required:
                - claim-type
                title: claim
                x-anyOf:
                - type: object
                  properties:
                    aeoi-entity-classification:
                      title: aeoi-entity-classification
                      enum:
                      - passive-nfe
                      - active-nfe
                      - financial-institution
                      type: string
                      description: "AEOI/CRS entity classification. Submit `financial-institution`\n         if the entity is a financial institution (e.g. a bank, investment fund, or insurance company).\n         Submit `active-nfe` if more than 50% of the entity's gross income is active\n         (e.g. trading, manufacturing, or providing services) and more than 50% of its assets are used\n         to generate that active income. Submit `passive-nfe` if the entity's income is predominantly passive\n         (e.g dividends, interest, rent, royalties, or capital gains) or if it is dormant."
                    claim-type:
                      enum:
                      - aeoi-entity-classification
                      type: string
                  required:
                  - aeoi-entity-classification
                  - claim-type
                  title: aeoi-entity-classification
                - type: object
                  properties:
                    telephone-number:
                      title: telephone-number
                      pattern: (\+[1-9])?\d{1,14}
                      example: '+442012345678'
                    claim-type:
                      enum:
                      - alternative-number
                      type: string
                  required:
                  - telephone-number
                  - claim-type
                  title: alternative-number
                - type: object
                  properties:
                    annual-turnover:
                      title: annual-turnover
                      required:
                      - currency
                      - value
                      properties:
                        currency:
                          enum:
                          - GBP
                          type: string
                          title: currency code
                          example: GBP
                          default: GBP
                        value:
                          type: string
                          title: value
                          description: The unsigned value as a decimal-formatted string
                          example: '1000.00'
                          default: '1.00'
                      type: object
                      additionalProperties: false
                    claim-type:
                      enum:
                      - annual-turnover
                      type: string
                  required:
