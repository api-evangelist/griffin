                            type: string
                            minLength: 1
                          - {}
                      title: tins-by-country
                      description: "A map of tax identification numbers keyed by ISO 3166-1 alpha-2 country codes,\n                                  where values are arrays of strings. TIN requirements vary by country — see below.<br><br>\n                                  TINs may be submitted with or without separators (spaces, hyphens, dots, slashes, parentheses). Once\n                                  separators are stripped and letters upper-cased, a TIN must be 5–20 alphanumeric characters;\n                                  US TINs must additionally resolve to exactly 9 digits.<br><br>\n                                  **TIN required** — a TIN must be provided for these countries. Exemptions are not accepted.\n                                  Includes countries such as `US`, `DE`, `FR`, `CN`, and others designated as **TIN required**\n                                  in our [country list](/docs/guides/gjra-country-list#tin-required). Additionally: `GB` is only required for sole traders with annual\n                                  revenue over £90,000, and `US` is required for all US citizens regardless of tax residency.<br><br>\n                                  **TIN required unless exempt** — a TIN should be provided where available.\n                                  If a TIN cannot be provided, a valid exemption code must be submitted in\n                                  `tin-exemptions-by-country` instead. Includes countries such as `AU`, `IN`, `JP`, `MX`,\n                                  and others designated as **TIN required unless exempt** in our\n                                  [country list](/docs/guides/gjra-country-list#tin-required-unless-exempt).<br><br>\n                                  **TIN not required** — no TIN or exemption code is required. These countries can be\n                                  omitted in this field.\n                                  Includes countries such as `GB` (except sole traders over £90K), and all countries\n                                  designated as **TIN not required** in our\n                                  [country list](/docs/guides/gjra-country-list#tin-not-required).<br><br>\n                                  A country must not appear in both `tins-by-country` and `tin-exemptions-by-country`.<br><br>\n                                  Example:\n                                  `{ \"DE\": [\"1234 5678 901\"], \"US\": [\"123-45-6789\", \"12-3456789\"] }`"
                      example: '{ "DE": ["1234 5678 901"], "US": ["123-45-6789", "12-3456789"] }'
                    tin-exemptions-by-country:
                      type: object
                      additionalProperties:
                        title: tin-exemption
                        type: string
                        enum:
