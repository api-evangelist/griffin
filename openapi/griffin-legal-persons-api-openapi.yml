                        - no-tin-required-by-domestic-law
                        - unable-to-obtain-a-tin
                      title: tin-exemptions-by-country
                      description: "A map of OECD exemption codes keyed by ISO 3166-1 alpha-2 country codes,\n                                  where values are one of the accepted codes below. Only valid for countries\n                                  in the **TIN required unless exempt** category.\n                                  A country must not appear in both `tin-exemptions-by-country` and `tins-by-country`.<br><br>\n                                  Example:\n                                  `{ \"AU\": \"unable-to-obtain-a-tin\", \"IN\": \"jurisdiction-does-not-issue-tins\" }`"
                      example: '{ "AU": "unable-to-obtain-a-tin", "IN": "jurisdiction-does-not-issue-tins" }'
