openapi: 3.2.0
info:
  title: Griffin Pooled account membership API
  version: ''
  description: '## Introduction


    The Griffin API is based on REST.'
servers:
- url: https://api.griffin.com/
security:
- api-key-auth: []
tags:
- name: Pooled account membership
