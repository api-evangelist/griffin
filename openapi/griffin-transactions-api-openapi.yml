                    description: Specifies the direction of a balance change.
                  origin-metadata:
                    type: object
                    additionalProperties:
                      type: string
                    title: origin-metadata
                    description: Identifiers from the system that originated the hold or transaction. Keys and values are originator-specific.
                  effective-at:
