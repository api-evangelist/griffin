                    - {}
                    - type: object
                      properties:
                        bank-account-transaction-id:
                          type: string
                          format: ''
                          title: transaction-id
                          required: true
                          name: transaction-id
                      required:
                      - bank-account-transaction-id
                    x-anyOf:
                    - type: string
                      x-allOf:
                      - type: string
                      - {}
                      - type: object
                        properties:
                          bank-account-transaction-id:
                            type: string
                            format: ''
                            title: transaction-id
                            required: true
                            name: transaction-id
                        required:
                        - bank-account-transaction-id
                    - type: string
                      x-allOf:
                      - type: string
                      - {}
                      - type: object
                        properties:
                          bank-account-transaction-id:
                            type: string
                            format: ''
                            title: transaction-id
                            required: true
                            name: transaction-id
                        required:
                        - bank-account-transaction-id
                    title: account-transaction-url
                    description: Link to the transaction resource.
                    example: /v0/bank/transactions/tr.ICB0cmFuc2FjdGlvbi1pZA
                  processed-at:
