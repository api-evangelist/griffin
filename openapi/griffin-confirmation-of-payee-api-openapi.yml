                    type: object
                    properties:
                      status:
                        title: status
                        type: string
                        enum:
                        - verified
                        - unverified
                      result:
                        title: result
                        type: string
                        enum:
                        - match
                        - close-match
                        - no-match
                      reason:
                        title: reason
                        type: string
                        enum:
                        - no-match-name
                        - account-not-supported
                        - match-name-business-personal
                        - match-name-personal-business
                        - close-match-name-business-personal
                        - no-match-secondary-ref
                        - close-match-name
                        - account-switched
                        - close-match-name-personal-business
                      suggested-name:
                        type: string
                        title: suggested-name
                        description: The suggested name of the payee. Only present on a close match.
                      suggested-account-classification:
                        title: suggested-account-classification
                        enum:
                        - personal
                        - business
                        type: string
                        description: The suggested account classification. Only present on a close match.
                        example: business
                    required:
                    - status
                    - result
                    title: cop-response
                    description: The outcome of the CoP request
                required:
                - cop-request-url
                - account
                - cop-response
                title: cop-request
        '400':
          description: ''
        '401':
          description: Requires an API key to continue
