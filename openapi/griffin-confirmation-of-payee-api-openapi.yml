                        title: secondary-reference-data
                        description: Secondary reference data, such as a building society roll number or a credit card number.
                        example: '1234567890'
                    required:
                    - account-number
                    - bank-id
                    - account-classification
                    - name
                    - requester-legal-person-url
                    title: account
                    description: The payee's account details.
