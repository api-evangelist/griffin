                            format: ''
                            title: cop-request-id
                            required: true
                            name: cop-request-id
                        required:
                        - cop-request-id
                    title: cop-request-url
                    example: /v0/cop-request/cp.ICBjb3AtcmVxdWVzdC1pZA
                    description: Link to a [CoP request](#tag/Confirmation-of-payee).
                  account:
                    type: object
                    properties:
                      account-number:
                        type: string
                        x-allOf:
                        - type: string
                        - {}
                        title: account-number
                        pattern: ^[0-9]{8}$
                        description: A UK account number.
                        maxLength: 8
                        example: '12345678'
                        minLength: 8
                      bank-id:
                        title: bank-id
                        pattern: ^[0-9]{6}$
                        type: string
                        description: A UK sort code.
                        maxLength: 6
                        example: '123456'
                        minLength: 6
                      account-classification:
                        title: account-classification
                        type: string
                        enum:
                        - personal
                        - business
                      name:
                        title: name
                        description: The name of the payee.
                        example: John Smith
                      requester-legal-person-url:
                        type: string
                        x-allOf:
                        - type: string
                        - {}
                        - type: object
                          properties:
                            legal-person-id:
                              type: string
                              format: ''
